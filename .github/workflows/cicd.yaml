name: Build Push Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: devops-demo-eks
  USER_REPO: user-service
  PRODUCT_REPO: product-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Configure AWS credentials from GitHub repository secrets.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$USER_REPO:$IMAGE_TAG ./user-service
          docker build -t $ECR_REGISTRY/$PRODUCT_REPO:$IMAGE_TAG ./product-service

          docker push $ECR_REGISTRY/$USER_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$PRODUCT_REPO:$IMAGE_TAG

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Deploy to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION

          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/user-service-deployment.yaml
          kubectl apply -f k8s/user-service-service.yaml
          kubectl apply -f k8s/product-service-deployment.yaml
          kubectl apply -f k8s/product-service-service.yaml
          kubectl apply -f k8s/ingress.yaml

          # Update deployments with the new immutable image tags.
          kubectl -n devops-demo set image deployment/user-service user-service=$ECR_REGISTRY/$USER_REPO:$IMAGE_TAG
          kubectl -n devops-demo set image deployment/product-service product-service=$ECR_REGISTRY/$PRODUCT_REPO:$IMAGE_TAG

          kubectl -n devops-demo rollout status deployment/user-service
          kubectl -n devops-demo rollout status deployment/product-service
